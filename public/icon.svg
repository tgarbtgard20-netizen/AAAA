<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <rect x="32" y="32" width="448" height="448" rx="88" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.6" />
  <g transform="translate(96, 96)">
    <!-- POS Cash Register / Shopping Icon -->
    <rect x="20" y="80" width="280" height="180" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="12"/>
    <rect x="50" y="110" width="220" height="70" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="6"/>
    <!-- Screen content -->
    <text x="160" y="155" font-family="sans-serif" font-size="28" font-weight="bold" fill="#38bdf8" text-anchor="middle">HAJAYER POS</text>
    <!-- Buttons -->
    <circle cx="80" cy="220" r="14" fill="#10b981" />
    <circle cx="130" cy="220" r="14" fill="#3b82f6" />
    <circle cx="180" cy="220" r="14" fill="#f59e0b" />
    <circle cx="230" cy="220" r="14" fill="#ef4444" />
    <!-- Receipt slot -->
    <path d="M 100 80 L 100 40 L 220 40 L 220 80" fill="#f8fafc" stroke="#94a3b8" stroke-width="6"/>
    <line x1="120" y1="52" x2="200" y2="52" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="64" x2="180" y2="64" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
